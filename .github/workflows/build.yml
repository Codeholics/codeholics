name: build
on:
  push:
    branches:
      - dev
  workflow_call:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [ "22" ]
        os: [ ubuntu-latest, macOS-latest, windows-latest ]
    steps:
      - name: Checkout Site
        uses: actions/checkout@v7
        with:
          ref: dev
          path: codeholics
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: codeholics/astro/package-lock.json
      - name: Install Astro dependencies
        working-directory: codeholics/astro
        run: npm ci
      - name: Verify legacy content parity
        working-directory: codeholics/astro
        run: npm run verify:legacy-content-parity
      - name: Build Astro site
        working-directory: codeholics/astro
        run: npm run build
