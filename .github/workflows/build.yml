name: build
on:
  push:
    branches:
      - dev
  workflow_call:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]
        os: [ ubuntu-latest, macOS-latest, windows-latest ]
    steps:
      - name: Checkout Site
        uses: actions/checkout@v7
        with:
          ref: dev
          path: codeholics
      - name: Checkout Plugins
        uses: actions/checkout@v7
        with:
          repository: Codeholics/pelican-plugins
          path: pelican-plugins
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Sync dependencies
        working-directory: codeholics
        run: uv sync
      - name: Build Content
        working-directory: codeholics
        run: uv run pelican -s pelicanconf.py
