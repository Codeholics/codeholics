on:
  push:
    branches:
     - 'dev'
jobs:
  build:
    uses: Codeholics/codeholics/.github/workflows/build.yml@dev
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Site
        uses: actions/checkout@v7
        with:
          ref: dev
          path: codeholics
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: codeholics/astro/package-lock.json
      - name: Install Astro dependencies
        working-directory: codeholics/astro
        run: npm ci
      - name: Verify legacy content parity
        working-directory: codeholics/astro
        run: npm run verify:legacy-content-parity
      - name: Build Astro site
        working-directory: codeholics/astro
        run: npm run build
      - name: Copy files to dev.codeholics.com
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          timeout: 120s
          command_timeout: 10m
          debug: true
          source: "codeholics/astro/dist/*"
          #target: ${{ secrets.DEV_PATH }}
          target: "/home/codeholi/"
          strip_components: 2
          rm: true
          overwrite: true
