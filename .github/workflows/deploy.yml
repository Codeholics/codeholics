on:
  push:
    branches:
     - 'dev'
jobs:
  build:
    uses: Codeholics/codeholics/.github/workflows/build.yml@dev
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Site
        uses: actions/checkout@v7
        with:
          ref: dev
          path: codeholics
      - name: Checkout Plugins
        uses: actions/checkout@v7
        with:
          repository: Codeholics/pelican-plugins
          path: pelican-plugins
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Sync dependencies
        working-directory: codeholics
        run: uv sync
      - name: Build Content
        working-directory: codeholics
        run: uv run pelican -s pelicanconf.py
      - name: copy files to dev.codeholics.com
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete
          rsh: -oHostKeyAlgorithms=+ssh-rsa
          path: "output/*"
          remote_host: ${{ secrets.HOST }}
          remote_port: ${{ secrets.PORT }}
          remote_path: ${{ secrets.DEV_PATH }}
          remote_user: ${{ secrets.USERNAME }}
          remote_key: ${{ secrets.KEY }}
          remote_key_pass: ${{ secrets.PASSPHRASE }}
