on:
  push:
    branches:
     - 'dev'
jobs:
  build:
    uses: Codeholics/codeholics/.github/workflows/build.yml@dev
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Site
        uses: actions/checkout@v7
        with:
          ref: dev
          path: codeholics
      - name: Checkout Plugins
        uses: actions/checkout@v7
        with:
          repository: Codeholics/pelican-plugins
          path: pelican-plugins
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Sync dependencies
        working-directory: codeholics
        run: uv sync
      - name: Build Content
        working-directory: codeholics
        run: uv run pelican -s pelicanconf.py
      - name: Debug DNS resolution
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
        run: |
          echo "System resolver lookup:"
          getent hosts "$DEPLOY_HOST" || true
          echo
          echo "Cloudflare lookup:"
          nslookup "$DEPLOY_HOST" 1.1.1.1 || true
          echo
          echo "Google lookup:"
          nslookup "$DEPLOY_HOST" 8.8.8.8 || true
      - name: Debug SSH connectivity
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_PORT: ${{ secrets.PORT }}
        run: |
          echo "Testing TCP connection to $DEPLOY_HOST:$DEPLOY_PORT"
          nc -vz "$DEPLOY_HOST" "$DEPLOY_PORT" || true
      - name: Copy files to dev.codeholics.com
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          source: "codeholics/output/*"
          target: ${{ secrets.DEV_PATH }}
          strip_components: 2
          rm: true
          overwrite: true
